<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学习目标管理台</title>
<!-- 单文件离线工作台：零外部依赖（无 CDN / 字体 / 图标库），数据存本机 localStorage -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{
 --purple:#7c5cff;--purple2:#a78bfa;
 --grad:linear-gradient(135deg,#7c5cff 0%,#a78bfa 100%);
 --green:#16a34a;--greenbg:#e9f7ef;
 --red:#e0342f;--redbg:#fdeeeb;
 --amber:#d97706;--amberbg:#fdf4e3;
 --line:#e7e9f2;--sub:#6b7280;--ink:#1e2235;--card:#ffffff;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;background:#f6f7fb;color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
h1{font-size:22px}
h2.sec{font-size:14px;color:var(--sub);font-weight:600;margin:20px 2px 10px}
h3.sect{font-size:14px;color:var(--sub);font-weight:600;margin-bottom:10px}

/* ===== 布局骨架：电脑左侧边栏 / 平板顶部横导航 / 手机底部四 Tab ===== */
#app{display:flex;min-height:100vh}
#nav{width:224px;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;background:#fff;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-weight:700;font-size:16.5px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.navbtn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;color:var(--sub);font-size:15px;font-weight:500;transition:background .15s}
.navbtn:hover{background:#f2f3fa}
.navbtn.active{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(124,92,255,.25)}
.navfoot{margin-top:auto;padding:10px 8px;font-size:11.5px;color:#9aa1b2;line-height:1.7}
#main{flex:1;min-width:0;padding:26px 32px 70px;max-width:1240px}
.tabpage{display:none}
.tabpage.active{display:block}

/* ===== 通用组件 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(30,34,53,.04)}
.pagehead{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.pagehead .sub{color:var(--sub);font-size:13px;margin-top:2px}
.pagehead .btn{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--grad);color:#fff;border-radius:12px;padding:0 18px;height:44px;font-size:15px;font-weight:600;flex-shrink:0}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:#f2f3fa;color:var(--purple)}
.btn.danger{background:var(--red)}
.btn.sm{height:36px;padding:0 13px;font-size:13px;border-radius:10px}
.iconbtn{width:32px;height:32px;border-radius:9px;color:#9aa1b2;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:hover{background:#f2f3fa;color:var(--ink)}
.sel{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;background:#fff;max-width:100%}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));margin-bottom:8px}
.boardgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.scrollx{overflow-x:auto}
.empty{padding:26px;text-align:center;color:#9aa1b2;font-size:14px;background:#f8f9fd;border-radius:12px}

/* ===== 目标卡片 ===== */
.gcard{position:relative;overflow:hidden;padding-left:21px}
.gcard .edge{position:absolute;left:0;top:0;bottom:0;width:5px}
.gcard.pin-yellow{border-color:#eddcae;background:linear-gradient(180deg,#fffdf6,#fff)}
.gcard.pin-red{border-color:#f0c5c2;background:linear-gradient(180deg,#fff8f7,#fff)}
.gcard.overdue{border-color:#f0c5c2;background:linear-gradient(180deg,#fff8f7,#fff)}
.pin-strip{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:12px;line-height:1.45}
.pin-strip.amber{background:var(--amberbg);color:var(--amber)}
.pin-strip.red{background:var(--redbg);color:var(--red)}
.ghead{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.gname{font-weight:700;font-size:15.5px;line-height:1.35;word-break:break-all}
.gsub{font-size:12px;color:var(--sub);margin-top:3px}
.gops{display:flex;gap:2px;flex-shrink:0}
.progress{height:8px;border-radius:99px;background:#eef0f7;overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;transition:width .3s}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.pmeta .pct{font-size:15px;font-weight:800;color:var(--ink)}
.planbox{background:#f8f9fd;border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--sub);line-height:1.75;margin-top:10px}
.planbox b{color:var(--ink)}
.gact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.gact .btn{flex:1;min-width:120px}
.done-row{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--greenbg);border-radius:12px;color:var(--green);font-weight:600;margin-bottom:8px;font-size:14px}
.newgoal{width:100%;border:2px dashed #d9dcef;border-radius:16px;padding:15px;color:var(--purple);font-weight:600;font-size:15px;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;margin-top:4px}
.newgoal:hover{background:rgba(124,92,255,.05)}

/* ===== 备份横幅 ===== */
.banner{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(124,92,255,.07),rgba(167,139,250,.13));border:1px solid #e3dcff;border-radius:14px;padding:11px 14px;margin:4px 0 10px;color:#4c3a99;font-size:13.5px;line-height:1.5;flex-wrap:wrap}
.banner .btn{margin-left:auto}
.banner span{flex:1;min-width:200px}

/* ===== 表单与弹窗 ===== */
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:600}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(124,92,255,.25);border-color:var(--purple)}
textarea{resize:vertical}
.frow{display:flex;gap:10px}
.frow .field{flex:1}
.hint{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.6}
.overlay{position:fixed;inset:0;background:rgba(16,18,38,.48);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:22px;animation:modin .18s ease-out}
@keyframes modin{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swatch{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;display:inline-block}
.swatch.sel{border-color:var(--ink)}

/* ===== Toast / 彩带 ===== */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:toastin .22s}
@keyframes toastin{from{transform:translate(-50%,8px);opacity:0}to{transform:translateX(-50%);opacity:1}}
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.cf{position:absolute;top:-16px;width:9px;height:13px;animation:cfall linear forwards;opacity:.95}
@keyframes cfall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(105vh) rotate(660deg);opacity:.9}}

/* ===== 看板 ===== */
.kpi{display:flex;gap:8px;margin-top:12px}
.kpi .k{flex:1;background:#f8f9fd;border-radius:10px;padding:9px 6px;text-align:center;min-width:0}
.kpi .k b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k span{font-size:11px;color:var(--sub)}
.reclist{margin-top:12px;border-top:1px dashed var(--line);padding-top:9px}
.recrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 2px;border-bottom:1px solid #f2f3f8}
.recrow .date{color:var(--sub);width:76px;flex-shrink:0}
.recrow .tagwrap{width:24px;flex-shrink:0;display:flex}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;font-weight:700}
.tag.bu{background:var(--amberbg);color:var(--amber)}
.chart{width:100%;height:auto;display:block}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:#9aa1b2}

/* ===== 周报 ===== */
.wtable{width:100%;border-collapse:collapse;font-size:13.5px}
.wtable th{text-align:left;color:var(--sub);font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.wtable td{padding:10px 6px;border-bottom:1px solid #f2f3f8;white-space:nowrap}
.wtable .up,.wtable .down,.wtable .flat{font-weight:600;font-size:12px;margin-left:2px}

/* ===== 我的 ===== */
.mlist .mrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f2f3f8}
.mrow .mi{width:38px;height:38px;border-radius:11px;background:#f2f3fa;color:var(--purple);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mrow .mt{flex:1;min-width:0}
.mrow .mt b{display:block;font-size:15px}
.mrow .mt span{font-size:12.5px;color:var(--sub);line-height:1.5;display:block}
.steps ol{padding-left:20px;line-height:2.1;color:var(--sub);font-size:14px}

/* ===== 响应式 ===== */
@media (min-width:1024px){.floatbtn{display:none}}
@media (min-width:768px) and (max-width:1023px){
 #app{flex-direction:column}
 #nav{width:100%;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;padding:10px 16px;z-index:50;border-right:none;border-bottom:1px solid var(--line)}
 .brand{padding:0 14px 0 0;font-size:15px}
 .brand .logo{width:28px;height:28px}
 .navbtn{padding:9px 13px;font-size:14px}
 .navfoot{display:none}
 #main{padding:20px 20px 80px;max-width:none}
 .grid{grid-template-columns:repeat(2,1fr)}
 .boardgrid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:767px){
 #app{flex-direction:column}
 #nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;padding:5px 6px calc(5px + env(safe-area-inset-bottom));border-right:none;border-top:1px solid var(--line);z-index:90;background:#fff;gap:2px}
 .brand{display:none}
 .navbtn{flex:1;flex-direction:column;gap:3px;font-size:11px;padding:6px 2px;justify-content:center;min-height:52px;border-radius:12px}
 .navfoot{display:none}
 #main{padding:14px 12px calc(100px + env(safe-area-inset-bottom));max-width:none}
 .grid,.boardgrid{grid-template-columns:1fr}
 .pagehead h1{font-size:20px}
 .pagehead .btn{height:40px;padding:0 13px;font-size:14px}
 .floatbtn{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:80;display:flex;height:48px}
 .toast{bottom:calc(92px + env(safe-area-inset-bottom));max-width:88vw;text-align:center}
 .wtable{font-size:12.5px}
}
</style>
</head>
<body>
<div id="app">
 <nav id="nav">
  <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 3a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg></span><span>学习目标管理台</span></div>
  <button class="navbtn active" data-tab="today"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M7 2h2v2h6V2h2v2h3v18H4V4h3V2zM6 10v8h12v-8H6zm2-4v2h2V6H8z"/></svg>今日</button>
  <button class="navbtn" data-tab="board"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M4 20V4h2v14h14v2H4zm4-5V9h2.5v6H8zm4.8 0V5h2.4v10h-2.4zm4.8 0v-7h2.4v7h-2.4z"/></svg>看板</button>
  <button class="navbtn" data-tab="week"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M6 2h9l5 5v15H6V2zm8 1.5V8h4.5L14 3.5zM8 11h8v2H8v-2zm0 4h8v2H8v-2z"/></svg>周报</button>
  <button class="navbtn" data-tab="mine"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm-8 9c0-3.9 3.6-6.5 8-6.5s8 2.6 8 6.5v1H4v-1z"/></svg>我的</button>
  <div class="navfoot">完全离线 · 单文件<br>数据只存本机浏览器<br>记得定期导出备份</div>
 </nav>
 <main id="main">
  <section id="tab-today" class="tabpage active">
   <div class="pagehead">
    <div><h1>今日</h1><div class="sub" id="todayDate"></div></div>
    <button class="btn" onclick="openGoalModal(null)"><svg width="15" height="15" viewBox="0 0 24 24"><path fill="#fff" d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7V4z"/></svg>新建目标</button>
   </div>
   <div id="bannerArea"></div>
   <h2 class="sec" id="pinTitle" style="display:none">今天要处理</h2>
   <div class="grid" id="pinArea"></div>
   <h2 class="sec">可打卡目标</h2>
   <div class="grid" id="goalGrid"></div>
   <button class="newgoal" onclick="openGoalModal(null)"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7V4z"/></svg>新建目标</button>
   <div id="doneArea" style="margin-top:20px"></div>
   <button class="btn floatbtn" onclick="openGoalModal(null)"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="#fff" d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7V4z"/></svg>新建目标</button>
  </section>
  <section id="tab-board" class="tabpage">
   <div class="pagehead"><h1>看板</h1></div>
   <div class="card"><h3 class="sect">近 14 天投入分钟 · 分目标堆叠</h3><div id="chart14"></div></div>
   <div class="boardgrid" id="boardGrid" style="margin-top:16px"></div>
  </section>
  <section id="tab-week" class="tabpage">
   <div class="pagehead"><h1>周报</h1><select id="weekSel" class="sel" style="margin-left:auto" onchange="state.week=this.value;renderWeek()"></select></div>
   <div id="weekBody"></div>
  </section>
  <section id="tab-mine" class="tabpage">
   <div class="pagehead"><h1>我的</h1></div>
   <div id="mineBody"></div>
  </section>
 </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
'use strict';
/* ================= 常量与工具 ================= */
var LS_KEY='wb_goaltracker_v2';
var PALETTE=['#7c5cff','#0ea5e9','#10b981','#f59e0b','#f43f5e','#8b5cf6','#06b6d4','#84cc16'];
var state={tab:'today',week:null};

function pad2(n){return (n<10?'0':'')+n;}
function dstr(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function parseD(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function todayStr(){return dstr(new Date());}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function weekStart(s){var d=parseD(s);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dstr(d);}
function fmtMD(s){return (+s.slice(5,7))+'月'+(+s.slice(8,10))+'日';}
function fmtCN(s){return fmtMD(s);}
function weekdayCN(s){return '周'+'日一二三四五六'.charAt(parseD(s).getDay());}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ================= 图标（全部内联 SVG，无 emoji） ================= */
function icon(n,sz,c){
 var p={
  plus:'M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7V4z',
  check:'M4 12.5l5 5L20 6.5',
  edit:'M3 17.25V21h3.75l10.8-10.8-3.75-3.75L3 17.25zm16.6-10.85c.4-.4.4-1 0-1.4l-2.3-2.3c-.4-.4-1-.4-1.4 0l-1.8 1.8 3.7 3.7 1.8-1.8z',
  trash:'M6 7h12l-.9 13.1c-.05.8-.72 1.4-1.5 1.4H8.4c-.78 0-1.45-.6-1.5-1.4L6 7zm3.5-4h5l1 1.8H19v2H5v-2h2.5l1-1.8zM9.5 11v7h1.6v-7H9.5zm3.4 0v7h1.6v-7h-1.6z',
  flame:'M12 2.2c.9 3.4 4.4 5.1 4.4 8.9a4.4 4.4 0 1 1-8.8 0c0-1.6.7-2.9 1.6-4 .5.9 1.3 1.5 2.1 1.7-.3-2 .1-4.2.7-6.6z',
  moon:'M20.4 14.2A8.5 8.5 0 1 1 9.8 3.6a7 7 0 0 0 10.6 10.6z',
  flag:'M5 3h2v18H5V3zm4 1h10l-2.4 4L19 12H9V4z',
  alert:'M12 2l10 18H2L12 2zm-1 7v6h2V9h-2zm0 7.5v2h2v-2h-2z',
  down:'M11 3h2v10l4-4 1.4 1.4L12 17.8 5.6 10.4 7 9l4 4V3zM4 19h16v2H4z',
  up:'M11 21h-2V11l-4 4-1.4-1.4L12 6.2l6.4 7.4L17 15l-4-4v10zM4 3h16v2H4z',
  copy:'M8 2h12v12h-2V4H8V2zM4 6h12v16H4V6zm2 2v12h8V8H6z',
  refresh:'M12 4a8 8 0 0 1 7.4 5H17l4 4.5L24.5 9h-2.2A10 10 0 0 0 3.6 7.6l1.9.7A8 8 0 0 1 12 4zm7.5 8.5l-1.6 1.2A8 8 0 0 1 4.6 15H7L3 10.5-2.5 15h2.2A10 10 0 0 0 20.4 16l-1.9-.7a8 8 0 0 1 .9-2.8z',
  doc:'M6 2h9l5 5v15H6V2zm8 1.5V8h4.5L14 3.5zM8 11h8v2H8v-2zm0 4h8v2H8v-2z',
  x:'M6.4 5L12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z'
 };
 var line=(n==='check');
 return '<svg width="'+(sz||16)+'" height="'+(sz||16)+'" viewBox="0 0 24 24" aria-hidden="true">'+
  (line?'<path fill="none" stroke="'+(c||'currentColor')+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="'+p[n]+'"/>'
       :'<path fill="'+(c||'currentColor')+'" d="'+p[n]+'"/>')+'</svg>';
}

/* ================= 数据层（localStorage） ================= */
var DB=null;
function defaultDB(){return {version:2,goals:[],records:[],weekly:{}};}
function loadDB(){
 var raw=null;
 try{raw=localStorage.getItem(LS_KEY);}catch(e){}
 if(raw){ try{DB=JSON.parse(raw);}catch(e){DB=null;} }
 if(!DB||typeof DB!=='object'){DB=defaultDB();}
 if(!Array.isArray(DB.goals))DB.goals=[];
 if(!Array.isArray(DB.records))DB.records=[];
 if(!DB.weekly||typeof DB.weekly!=='object')DB.weekly={};
}
function saveDB(){
 try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}
 catch(e){toast('保存失败：本地存储空间不足，请导出备份后清理');}
}

/* ================= Toast / 弹窗 / 二次确认 ================= */
var toastTimer=null;
function toast(msg){
 var r=document.getElementById('toastRoot');
 r.innerHTML='<div class="toast">'+esc(msg)+'</div>';
 clearTimeout(toastTimer);
 toastTimer=setTimeout(function(){r.innerHTML='';},2600);
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function openModal(html){

/* ================= 计算层（纯函数，渲染层只读） ================= */
function goalById(id){for(var i=0;i<DB.goals.length;i++){if(DB.goals[i].id===id)return DB.goals[i];}return null;}
function recordsOn(gid,d){return DB.records.filter(function(r){return r.goalId===gid&&r.date===d;});}
function hasRecord(gid,d){return recordsOn(gid,d).length>0;}
function sumMinutes(gid,d){var rs=recordsOn(gid,d),m=0;for(var i=0;i<rs.length;i++){m+=(+rs[i].minutes||0);}return m;}
function goalRecords(gid){return DB.records.filter(function(r){return r.goalId===gid;});}
function totalDone(gid){var s=0;var rs=goalRecords(gid);for(var i=0;i<rs.length;i++){s+=(+rs[i].amount||0);}return s;}
function remainingOf(g){return Math.max(0,(+g.total||0)-totalDone(g.id));}
function daysLeftOf(g){return diffDays(todayStr(),g.deadline);}
function suggestAmount(g){
 var rem=remainingOf(g);if(rem<=0)return 0;
 var dl=daysLeftOf(g);if(dl<1)dl=1;
 return Math.ceil(rem/dl);
}
/* 连续天数：每周一重置 1 个休息日额度，本周首漏不中断，二漏才断 */
function computeStreak(g){
 var t=todayStr();
 var cursor=hasRecord(g.id,t)?t:addDays(t,-1);
 var misses={},streak=0,guard=0;
 while(guard++<3660){
  if(cursor<g.createdAt)break;
  if(hasRecord(g.id,cursor)){streak++;cursor=addDays(cursor,-1);continue;}
  var wk=weekStart(cursor);
  misses[wk]=(misses[wk]||0)+1;
  if(misses[wk]===1){cursor=addDays(cursor,-1);continue;}
  break;
 }
 return streak;
}
/* 昨日漏卡：黄卡=本周首漏（休息日额度兜住） / 红卡=本周已有第二次漏（连续中断） */
function pinInfo(g){
 var t=todayStr(),y=addDays(t,-1);
 if(y<g.createdAt)return null;
 if(hasRecord(g.id,y))return null;
 var ws=weekStart(y);
 var from=(ws>g.createdAt?ws:g.createdAt);
 var miss=0;
 for(var d=from;d<=y;d=addDays(d,1)){
  if(d===y)continue;
  if(!hasRecord(g.id,d))miss++;
 }
 return miss>=1?'red':'yellow';
}
/* 预计完成日：近 7 天平均速度（按日历天），记录天数<2 或速度为 0 时「暂无推算」，不编数字 */
function computePredict(g){
 if(remainingOf(g)<=0)return {done:true};
 var t=todayStr(),start=addDays(t,-6),days=0,sum=0;
 for(var d=start;d<=t;d=addDays(d,1)){
  var rs=recordsOn(g.id,d);
  if(rs.length){days++;for(var i=0;i<rs.length;i++){sum+=(+rs[i].amount||0);}}
 }
 if(days<2||sum<=0)return null;
 var speed=sum/7;
 var need=Math.ceil(remainingOf(g)/speed);
 var pd=addDays(t,need);
 return {date:pd,diff:diffDays(pd,g.deadline)};
}
function predictText(g){
 var p=computePredict(g);
 if(!p)return {t:'暂无推算',c:'flat',s:'近 7 天记录不足'};
 if(p.done)return {t:'已完成',c:'up',s:''};
 var d=p.diff;
 if(d>0)return {t:fmtCN(p.date)+'（提前'+d+'天）',c:'up',s:'按近 7 天速度'};
 if(d===0)return {t:fmtCN(p.date)+'（踩线完成）',c:'',s:'按近 7 天速度'};
 return {t:fmtCN(p.date)+'（拖后'+(-d)+'天）',c:'down',s:'按近 7 天速度'};
}

function renderPins(){
 var t=todayStr(),arr=[];
 DB.goals.forEach(function(g){
  if(remainingOf(g)<=0)return;
  if(g.deadline<t){arr.push({g:g,m:'overdue'});return;}
  var p=pinInfo(g);
  if(p)arr.push({g:g,m:p==='red'?'pin-red':'pin-yellow'});
 });
 var w={overdue:0,'pin-red':1,'pin-yellow':2};
 arr.sort(function(a,b){return w[a.m]-w[b.m];});
 var html='';
 for(var i=0;i<arr.length;i++){html+=goalCard(arr[i].g,arr[i].m);}
 document.getElementById('pinArea').innerHTML=html;
 document.getElementById('pinTitle').style.display=arr.length?'block':'none';

function goalCard(g,mode){
 var t=todayStr();
 var done=totalDone(g.id);
 var pct=Math.min(100,Math.round(done*100/(+g.total||1)));
 var st=computeStreak(g),pt=predictText(g);
 var strip='';
 if(mode==='pin-yellow')strip='<div class="pin-strip amber">'+icon('moon',15)+'<span>昨日未打卡 · 本周首漏，用休息日额度兜住，连续天数保留</span></div>';
 if(mode==='pin-red')strip='<div class="pin-strip red">'+icon('alert',15)+'<span>昨日未打卡 · 本周休息日额度已用完，连续中断，从今天重新开始</span></div>';
 if(mode==='overdue'){
  var od=diffDays(g.deadline,t);
  strip='<div class="pin-strip red">'+icon('flag',15)+'<span>已逾期 '+od+' 天 · 还剩 '+remainingOf(g)+' '+esc(g.unit)+' 没完成</span></div>';
 }
 var plan='';
 if(g.obstacle||g.plan){
  plan='<div class="planbox">'+
   (g.obstacle?'<b>最易拦住我：</b>'+esc(g.obstacle)+'<br>':'')+
   (g.plan?'<b>如果它出现，我就：</b>'+esc(g.plan):'')+'</div>';
 }
 var sugg=suggestAmount(g);
 var act;
 if(mode==='overdue'){
  act='<button class="btn sm" onclick="openCheckin(\''+g.id+'\')">'+icon('check',14)+'立即打卡</button>'+
      '<button class="btn ghost sm" onclick="openGoalModal(\''+g.id+'\')">调整计划</button>';
 }else if(mode==='pin-yellow'||mode==='pin-red'){
  act='<button class="btn sm" onclick="openCheckin(\''+g.id+'\')">'+icon('check',14)+'打卡（建议 '+sugg+' '+esc(g.unit)+'）</button>'+
      '<button class="btn ghost sm" onclick="openCheckin(\''+g.id+'\',\''+addDays(t,-1)+'\')">补记昨日</button>';
 }else{
  act='<button class="btn sm" onclick="openCheckin(\''+g.id+'\')">'+icon('check',14)+'打卡（建议 '+sugg+' '+esc(g.unit)+'）</button>';
 }
 return '<div class="card gcard '+mode+'"><span class="edge" style="background:'+esc(g.color)+'"></span>'+strip+
  '<div class="ghead"><div style="min-width:0"><div class="gname">'+esc(g.name)+'</div>'+
  '<div class="gsub">'+done+' / '+g.total+' '+esc(g.unit)+' · 截止 '+fmtCN(g.deadline)+' '+weekdayCN(g.deadline)+'</div></div>'+
  '<div class="gops"><button class="iconbtn" onclick="openGoalModal(\''+g.id+'\')" aria-label="编辑">'+icon('edit',15)+'</button>'+
  '<button class="iconbtn" onclick="delGoal(\''+g.id+'\')" aria-label="删除">'+icon('trash',15)+'</button></div></div>'+
  '<div class="progress"><i style="width:'+pct+'%;background:'+esc(g.color)+'"></i></div>'+
  '<div class="pmeta"><span class="pct">'+pct+'%</span>'+
  '<span class="'+pt.c+'">'+(st>0?'连续 '+st+' 天':'已中断')+' · 预计完成：'+pt.t+'</span></div>'+
  plan+'<div class="gact">'+act+'</div></div>';
}

function openCheckin(gid,presetDate){
 var g=goalById(gid);if(!g)return;
 var t=todayStr(),sel=presetDate||t,opts='';
 for(var i=0;i<7;i++){
  var d=addDays(t,-i),rs=recordsOn(gid,d);
  opts+='<option value="'+d+'"'+(d===sel?' selected':'')+'>'+fmtCN(d)+weekdayCN(d)+
   (i===0?'（今天）':'')+(rs.length?'（已有 '+rs.length+' 条）':'')+'</option>';
 }

 openModal('<h3 style="font-size:18px;margin-bottom:16px">打卡 · '+esc(g.name)+'</h3>'+
  '<div class="field"><label>日期（最多补记最近 6 天，按真实日期计入统计）</label><select id="ck_date">'+opts+'</select></div>'+
  '<div class="field"><label>数量（'+esc(g.unit)+'）</label><input type="number" id="ck_amount" min="0" step="any" value="'+sugg+'">'+
  '<div class="hint">今日建议量 = 剩余 '+remainingOf(g)+' '+esc(g.unit)+' ÷ 剩余 '+Math.max(1,daysLeftOf(g))+' 天 = '+sugg+' '+esc(g.unit)+'，可直接修改</div></div>'+

  '<div class="hint" id="ck_bf" style="display:none;color:var(--amber);font-weight:600">所选日期不是今天，将记为「补」打卡，按真实日期计入连续天数与预计推算</div>'+
  '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">'+
  '<button class="btn ghost" style="height:42px" onclick="closeModal()">取消</button>'+
  '<button class="btn" style="height:42px" onclick="submitCheckin(\''+gid+'\')">记一笔</button></div>');
 var dsel=document.getElementById('ck_date');
 dsel.addEventListener('change',function(){
  document.getElementById('ck_bf').style.display=(dsel.value===t)?'none':'block';
 });
 if(sel!==t)document.getElementById('ck_bf').style.display='block';

function submitCheckin(gid){
 var g=goalById(gid);if(!g)return;
 var d=document.getElementById('ck_date').value;
 var a=parseFloat(document.getElementById('ck_amount').value);
 if(isNaN(a)||a<=0){toast('数量需要是大于 0 的数字');return;}
 var m=parseInt(document.getElementById('ck_minutes').value,10);
 var before=totalDone(gid);
 DB.records.push({id:uid(),goalId:gid,date:d,amount:a,minutes:isNaN(m)||m>0?m:null,isBackfill:(d!==todayStr()),createdAt:new Date().toISOString()});
 saveDB();closeModal();
 var after=totalDone(gid);
 if(before<(+g.total||0)&&after>=(+g.total||0)){
  confetti();toast('目标「'+g.name+'」达成！');
 }else{
  toast('已记录 '+a+' '+g.unit+(d!==todayStr()?'（补）':''));
 }
 refreshAll();
}

function pickColor(el){

function submitGoal(gid){
 var name=document.getElementById('gm_name').value.trim();
 var unit=document.getElementById('gm_unit').value.trim()||'次';
 var total=parseInt(document.getElementById('gm_total').value,10);
 var dl=document.getElementById('gm_deadline').value;
 if(!name){toast('请填写目标名称');return;}
 if(!total||total<1){toast('总量需要是正整数');return;}
 if(!dl){toast('请选择截止日');return;}
 var obs=document.getElementById('gm_obs').value.trim();
 var plan=document.getElementById('gm_plan').value.trim();
 var color=document.getElementById('gm_color').value;
 if(gid){
  var g=goalById(gid);
  if(g){g.name=name;g.unit=unit;g.total=total;g.deadline=dl;g.color=color;g.obstacle=obs;g.plan=plan;}
 }else{
  DB.goals.push({id:uid(),name:name,unit:unit,total:total,deadline:dl,color:color,obstacle:obs,plan:plan,createdAt:todayStr(),isSample:false});
 }
 saveDB();closeModal();refreshAll();
 toast(gid?'已保存修改':'目标已创建，今天就可以打卡');
}
function delGoal(gid){
 var g=goalById(gid);if(!g)return;
 openConfirm('删除目标','将删除「'+g.name+'」及其全部 '+goalRecords(gid).length+' 条打卡记录，删除后不可恢复。确定删除吗？',
  function(){
   DB.goals=DB.goals.filter(function(x){return x.id!==gid;});
   DB.records=DB.records.filter(function(r){return r.goalId!==gid;});
   saveDB();refreshAll();toast('已删除');
  });
}
/* 达成彩带 */
function confetti(){
 var wrap=document.createElement('div');wrap.className='confetti-wrap';
 var cols=['#7c5cff','#a78bfa','#16a34a','#f59e0b','#e0342f','#0ea5e9'];
 for(var i=0;i<44;i++){
  var p=document.createElement('i');p.className='cf';
  p.style.left=(6+Math.random()*88)+'%';
  p.style.background=cols[i%cols.length];
  p.style.animationDelay=(Math.random()*0.5)+'s';
  p.style.animationDuration=(1.6+Math.random()*1.2)+'s';
  if(i%3===0)p.style.borderRadius='50%';
  wrap.appendChild(p);
 }
 document.body.appendChild(wrap);
 setTimeout(function(){if(wrap.parentNode)wrap.parentNode.removeChild(wrap);},3400);
}

/* 近 14 天投入分钟 · 手写 SVG 堆叠柱状图（无分钟数据不硬凑） */
function renderChart14(){
 var el=document.getElementById('chart14');
 var t=todayStr(),goals=DB.goals,days=[];
 for(var i=13;i>=0;i--)days.push(addDays(t,-i));
 var data=[],maxv=0,hasMin=false;
 for(var j=0;j<days.length;j++){
  var d=days[j],segs=[];
  for(var k=0;k<goals.length;k++){
   var m=sumMinutes(goals[k].id,d);
   if(m>0){segs.push({c:goals[k].color,m:m});hasMin=true;}
  }
  var tot=0;
  for(var s=0;s<segs.length;s++)tot+=segs[s].m;
  if(tot>maxv)maxv=tot;
  data.push({d:d,segs:segs});
 }
 if(!goals.length||!hasMin){
  el.innerHTML='<div class="empty">近 14 天还没有分钟记录 —— 打卡时顺手填一下「投入分钟」，这里会生成分目标堆叠柱状图</div>';
  return;
 }
 var W=616,H=214,padL=34,padB=26,padT=12,bw=24;
 var gap=(W-padL-14*bw)/14,usable=H-padB-padT;
 var scale=maxv/Math.max(1,usable-8);
 var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="近14天投入分钟堆叠柱状图">';
 var fr=[0,0.5,1];
 for(var f=0;f<fr.length;f++){
  var y=padT+usable-fr[f]*usable,v=Math.round(maxv*fr[f]);
  svg+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-4)+'" y2="'+y.toFixed(1)+'" stroke="#edeff6" stroke-width="1"></line>'+
   '<text x="'+(padL-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9" fill="#9aa1b2">'+v+'</text>';
 }
 for(var q=0;q<data.length;q++){
  var dd=data[q],x=padL+q*(bw+gap)+gap/2,base=padT+usable;
  for(var w=0;w<dd.segs.length;w++){
   var sg=dd.segs[w],h=sg.m/scale;
   base-=h;
   svg+='<rect x="'+x.toFixed(1)+'" y="'+base.toFixed(1)+'" width="'+bw+'" height="'+Math.max(1,h).toFixed(1)+'" rx="2" fill="'+esc(sg.c)+'"></rect>';
  }
  svg+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" font-size="8.5" fill="#9aa1b2">'+(+dd.d.slice(8,10))+'</text>';
  if(dd.d===t)svg+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-3)+'" text-anchor="middle" font-size="7.5" fill="#7c5cff">今</text>';
 }
 svg+='</svg>';
 var legend='';
 for(var l=0;l<goals.length;l++){
  legend+='<span style="display:inline-flex;align-items:center;gap:4px"><i style="width:9px;height:9px;border-radius:2px;background:'+esc(goals[l].color)+';display:inline-block"></i>'+esc(goals[l].name)+'</span>';
 }
 el.innerHTML=svg+'<div style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:11.5px;color:var(--sub)">'+legend+'</div>';
}
function delRecord(rid){
 openConfirm('删除记录','删除这条打卡记录后不可恢复，完成率 / 连续天数 / 预计完成日会即时重算。确定吗？',
  function(){

/* ================= 周报 Tab ================= */
function weekStatsFor(gid,ws){
 var amt=0,days=0,min=0;
 for(var i=0;i<7;i++){
  var d=addDays(ws,i),rs=recordsOn(gid,d);
  if(rs.length){
   days++;
   for(var j=0;j<rs.length;j++){amt+=(+rs[j].amount||0);min+=(+rs[j].minutes||0);}
  }
 }
 return {amt:amt,days:days,min:min};
}
function allWeekStarts(){
 var t=todayStr(),cur=weekStart(t),first=cur;
 DB.goals.forEach(function(g){if(g.createdAt&&g.createdAt<first)first=g.createdAt;});
 DB.records.forEach(function(r){if(r.date<first)first=r.date;});
 first=weekStart(first);
 var arr=[],d=first,guard=0;
 while(d<=cur&&guard++<520){arr.push(d);d=addDays(d,7);}
 return arr.reverse();
}
function arrow(c,p){
 if(!c&&!p)return '<span class="flat">—</span>';
 if(!p&&c)return '<span class="up">新增</span>';
 var d=c-p;
 if(d===0)return '<span class="flat">持平</span>';
 var pct=Math.round(d*100/p);
 if(Math.abs(pct)<1)return (d>0?'<span class="up">+'+d+'</span>':'<span class="down">'+d+'</span>');
 return (d>0?'<span class="up">+'+pct+'%</span>':'<span class="down">'+pct+'%</span>');
}
function renderWeek(){
 var sel=document.getElementById('weekSel');
 var weeks=allWeekStarts();
 if(!weeks.length)weeks=[weekStart(todayStr())];
 if(!state.week||weeks.indexOf(state.week)<0)state.week=weeks[0];
 var opts='';
 for(var i=0;i<weeks.length;i++){
  opts+='<option value="'+weeks[i]+'"'+(weeks[i]===state.week?' selected':'')+'>'+fmtMD(weeks[i])+' 周 – '+fmtMD(addDays(weeks[i],6))+'</option>';
 }
 sel.innerHTML=opts;
 var ws=state.week,we=addDays(ws,6),pws=addDays(ws,-7),t=todayStr();
 var rows='',td=0,tm=0,ptd=0,ptm=0,any=false;
 DB.goals.forEach(function(g){
  var s=weekStatsFor(g.id,ws),ps=weekStatsFor(g.id,pws);
  if(s.days===0&&ps.days===0)return;
  any=true;td+=s.days;tm+=s.min;ptd+=ps.days;ptm+=ps.min;
  rows+='<tr><td style="font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis">'+esc(g.name)+'</td>'+
   '<td>'+s.amt+' '+esc(g.unit)+arrow(s.amt,ps.amt)+'</td>'+
   '<td>'+s.days+' 天'+arrow(s.days,ps.days)+'</td>'+
   '<td>'+(s.min?s.min+' 分':'—')+arrow(s.min,ps.min)+'</td></tr>';
 });
 var isCur=(ws===weeks[0]);
 var tbl=any?
  ('<div class="scrollx"><table class="wtable"><tr><th>目标</th><th>投入量（环比上周）</th><th>打卡天数（环比）</th><th>投入分钟（环比）</th></tr>'+rows+
   '<tr style="background:#f8f9fd;font-weight:700"><td>合计</td><td>—</td><td>'+td+' 天'+arrow(td,ptd)+'</td><td>'+(tm?tm+' 分':'—')+arrow(tm,ptm)+'</td></tr></table></div>')
  :'<div class="empty">这一周还没有打卡记录</div>';
 var wf=DB.weekly[ws]||{};
 document.getElementById('weekBody').innerHTML=
  '<div class="card"><div style="font-size:13px;color:var(--sub);margin-bottom:8px">'+fmtMD(ws)+' – '+fmtMD(we)+
   (isCur?'（本周进行中，截至今天 '+fmtMD(t)+'）':'')+'</div>'+tbl+'</div>'+
  '<div class="card" style="margin-top:16px"><h3 style="font-size:16px;margin-bottom:4px">本周复盘四栏（输入即时保存）</h3>'+
  wfField('keep','值得保持的',ws,wf.keep)+wfField('problem','出现的问题',ws,wf.problem)+
  wfField('try','做过的尝试',ws,wf.try)+wfField('next','下周预案',ws,wf.next)+'</div>'+
  '<div class="card" style="margin-top:16px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">'+
  '<h3 style="font-size:16px">周报文本</h3><button class="btn sm" onclick="genWeekText()">'+icon('doc',14)+'一键生成</button>'+
  '<button class="btn ghost sm" onclick="copyReport()">'+icon('copy',14)+'复制</button></div>'+
  '<textarea id="repOut" style="width:100%;min-height:180px;font-size:13px;line-height:1.8;border:1.5px solid var(--line);border-radius:10px;padding:10px" placeholder="点「一键生成」：按本周数据 + 环比 + 四栏复盘，生成可复制的周报文本"></textarea></div>';
}
function wfField(key,label,wk,val){
 return '<div class="field"><label>'+label+'</label><textarea data-wf="'+key+'" data-wk="'+wk+'" oninput="saveWF(this)" style="min-height:56px">'+esc(val||'')+'</textarea></div>';
}
function saveWF(el){
 var wk=el.getAttribute('data-wk'),k=el.getAttribute('data-wf');
 if(!DB.weekly[wk])DB.weekly[wk]={};
 DB.weekly[wk][k]=el.value;
 saveDB();
}
function genWeekText(){
 var ws=state.week,we=addDays(ws,6),pws=addDays(ws,-7);
 var lines=['【学习目标周报】'+fmtMD(ws)+' - '+fmtMD(we)];
 var td=0,tm=0,ptd=0,ptm=0,n=0;
 DB.goals.forEach(function(g){
  var s=weekStatsFor(g.id,ws);if(!s.days)return;
  var ps=weekStatsFor(g.id,pws);n++;
  td+=s.days;tm+=s.min;ptd+=ps.days;ptm+=ps.min;
  lines.push('· '+g.name+'：投入 '+s.amt+' '+g.unit+'，打卡 '+s.days+' 天'+(s.min?'，共 '+s.min+' 分钟':'')+
   ((ps.days||ps.amt)?'（上周 '+ps.amt+' '+g.unit+' / '+ps.days+' 天'+(ps.min?' / '+ps.min+' 分钟':'')+'）':'（上周无记录）'));
 });
 if(!n)lines.push('本周暂无打卡记录');
 lines.push('合计：打卡 '+td+' 天'+(tm?'，投入 '+tm+' 分钟':'')+((ptd||ptm)?'（上周 '+ptd+' 天'+(ptm?' / '+ptm+' 分钟':'')+'）':''));
 var wf=DB.weekly[ws]||{};
 lines.push('','【保持】',(wf.keep||'—'),'','【问题】',(wf.problem||'—'),'','【尝试】',(wf.try||'—'),'','【下周预案】',(wf.next||'—'),'','（学习目标管理台生成）');
 document.getElementById('repOut').value=lines.join('\n');
 toast('已生成周报文本，可复制');
}
function copyReport(){
 var el=document.getElementById('repOut');
 if(!el||!el.value){toast('请先生成周报');return;}
 el.focus();el.select();
 var ok=false;
 try{ok=document.execCommand('copy');}catch(e){ok=false;}
 if(!ok&&navigator.clipboard){navigator.clipboard.writeText(el.value).then(function(){toast('已复制到剪贴板');},function(){toast('复制失败，请手动全选');});return;}
 toast(ok?'已复制到剪贴板':'复制失败，请手动全选复制');
}

  (nSamp?mrow('trash','清空示例数据','移除 '+nSamp+' 个示例目标及其全部示例记录','clearSamples()','清空示例'):'')+
  '</div>'+
  '<div class="card" style="margin-top:16px"><h3 style="font-size:16px;margin-bottom:10px">危险区</h3>'+

  '<input type="text" id="wipeInput" placeholder="输入 清空 以确认" style="flex:1;min-width:160px;max-width:240px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px">'+
  '<button class="btn danger" onclick="clearAll()">清空全部数据</button></div>'+

  '<div class="card steps" style="margin-top:16px"><h3 style="font-size:16px;margin-bottom:8px">添加到手机主屏（3 步）</h3><ol>'+

  '<li>点浏览器菜单里的「添加到书签 / 收藏」先留个入口</li>'+
  '<li>再点「添加到主屏幕 / 添加到桌面」，桌面出现图标，点开即用，数据在同一浏览器内保留</li></ol></div>';

function exportJSON(){
 var data={app:'学习目标管理台',version:2,exportedAt:new Date().toISOString(),goals:DB.goals,records:DB.records,weekly:DB.weekly};
 var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 var a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='学习目标管理台-备份-'+todayStr().replace(/-/g,'')+'.json';
 document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);if(a.parentNode)a.parentNode.removeChild(a);},400);
 toast('已导出 JSON 备份');
}
function pickImport(){
 openModal('<h3 style="font-size:18px;margin-bottom:16px">导入备份</h3>'+
  '<div class="field"><label>选择之前导出的 JSON 文件</label><input type="file" id="impFile" accept=".json,application/json"></div>'+
  '<div class="hint">导入会先弹出覆盖确认，确认后当前数据被替换。</div>'+
  '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">'+
  '<button class="btn ghost" style="height:42px" onclick="closeModal()">取消</button>'+
  '<button class="btn" style="height:42px" onclick="doImport()">导入</button></div>');
}
function doImport(){
 var f=document.getElementById('impFile').files[0];
 if(!f){toast('请先选择文件');return;}
 var reader=new FileReader();
 reader.onload=function(){
  var data;
  try{data=JSON.parse(reader.result);}catch(e){toast('文件不是合法 JSON');return;}
  if(!data||!Array.isArray(data.goals)||!Array.isArray(data.records)){toast('文件格式不对：缺少 goals / records');return;}
  closeModal();
  openConfirm('覆盖确认','导入将覆盖当前全部数据（现有 '+DB.goals.length+' 个目标、'+DB.records.length+' 条记录），且不可撤销。确定继续吗？',
   function(){
    DB={version:2,goals:data.goals,records:data.records,weekly:(data.weekly&&typeof data.weekly==='object')?data.weekly:{}};
    state.week=null;
    saveDB();refreshAll();
    toast('导入成功：'+DB.goals.length+' 个目标 / '+DB.records.length+' 条记录');
   });
 };
 reader.readAsText(f,'utf-8');
}
function migrateOld(){
 var found=null,foundKey='';
 var keys=['wb_goaltracker','wb_goal_tracker','goalTrackerV1','wb_goaltracker_v1'];
 for(var i=0;i<keys.length&&!found;i++){
  var v=null;
  try{v=localStorage.getItem(keys[i]);}catch(e){}
  if(v){
   try{var d=JSON.parse(v);if(d&&Array.isArray(d.goals)){found=d;foundKey=keys[i];}}catch(e){}
  }
 }
 if(!found){toast('未发现旧版数据，无需迁移');return;}
 openConfirm('迁移旧版数据','发现旧版键「'+foundKey+'」（'+found.goals.length+' 个目标）。导入将覆盖当前数据，确定吗？',
  function(){
   var recs=Array.isArray(found.records)?found.records:[];
   DB={version:2,goals:found.goals,records:recs,weekly:(found.weekly&&typeof found.weekly==='object')?found.weekly:{}};
   state.week=null;
   saveDB();refreshAll();toast('迁移完成');
  });
}
function clearSamples(){
 var ids=DB.goals.filter(function(g){return g.isSample;}).map(function(g){return g.id;});
 if(!ids.length){toast('没有示例数据');return;}
 openConfirm('清空示例','将删除 '+ids.length+' 个示例目标及示例记录，确定吗？',
  function(){
   DB.goals=DB.goals.filter(function(g){return !g.isSample;});
   DB.records=DB.records.filter(function(r){return ids.indexOf(r.goalId)<0;});
   state.week=null;
   saveDB();refreshAll();toast('示例数据已清空');
  });
}
function clearAll(){
 var v=(document.getElementById('wipeInput').value||'').trim();
 if(v!=='清空'){toast('请先在输入框里输入「清空」两个字');return;}
 openConfirm('清空全部','所有目标、打卡记录、周报复盘都会被删除且不可恢复。真的要清空吗？',
  function(){
   try{localStorage.removeItem(LS_KEY);}catch(e){}
   DB=defaultDB();state.week=null;
   saveDB();refreshAll();toast('已清空全部数据');
  });
}

/* ================= 预置示例（覆盖：补记 / 休息日黄卡 / 连续漏打红卡 / 逾期 / 障碍预案） ================= */
function seedSamples(){
 var t=todayStr();
 var gA={id:uid(),name:'背完 2000 核心词',unit:'词',total:2000,deadline:addDays(t,80),color:'#7c5cff',
  obstacle:'周末一出门就是一整天，容易断',plan:'如果周末中午前还没背，就先背 20 个再出门',createdAt:addDays(t,-9),isSample:true};
 var gB={id:uid(),name:'读完《人类简史》',unit:'页',total:440,deadline:addDays(t,30),color:'#0ea5e9',
  obstacle:'历史细节多的章节容易一卡好几天',plan:'如果卡住超过两天，就先跳到下一章做笔记，回头再补',createdAt:addDays(t,-8),isSample:true};
 var gC={id:uid(),name:'Python 进阶课',unit:'课时',total:40,deadline:addDays(t,-2),color:'#f43f5e',
  obstacle:'晚上刷视频网站停不下来',plan:'如果打开视频网站超过 10 分钟，就关掉去自习室',createdAt:addDays(t,-12),isSample:true};
 DB.goals=[gA,gB,gC];
 var R=[],mk=function(g,d,a,m,bf){
  R.push({id:uid(),goalId:g.id,date:d,amount:a,minutes:(m>0?m:null),isBackfill:!!bf,createdAt:new Date().toISOString()});
 };
 var aAmt=[60,70,65,80,55,75,60,70],aMin=[45,40,35,50,42,38,44,41];
 for(var i=0;i<8;i++)mk(gA,addDays(t,-9+i),aAmt[i],aMin[i]);
 mk(gA,addDays(t,-5),20,0,true);
 mk(gB,addDays(t,-8),30,30);mk(gB,addDays(t,-7),35,25);mk(gB,addDays(t,-6),28,35);mk(gB,addDays(t,-5),32,28);
 mk(gC,addDays(t,-12),8,60);mk(gC,addDays(t,-10),8,75);mk(gC,addDays(t,-8),7,50);mk(gC,addDays(t,-6),7,65);mk(gC,addDays(t,-3),6,55);
 DB.records=R;
}

/* ================= 统一刷新入口 + 初始化（渲染函数之间零互调，无环路） ================= */

 renderToday();
 renderBoard();

function switchTab(name){
 state.tab=name;
 var bs=document.querySelectorAll('.navbtn');
 for(var i=0;i<bs.length;i++){bs[i].classList.toggle('active',bs[i].getAttribute('data-tab')===name);}

 for(var j=0;j<ps.length;j++){ps[j].classList.toggle('active',ps[j].id==='tab-'+name);}
 window.scrollTo(0,0);
}
document.addEventListener('DOMContentLoaded',function(){
 loadDB();
 if(DB.goals.length===0&&DB.records.length===0){seedSamples();saveDB();}
 var bs=document.querySelectorAll('.navbtn');
 for(var i=0;i<bs.length;i++){
  (function(b){b.addEventListener('click',function(){switchTab(b.getAttribute('data-tab'));});})(bs[i]);
 }
 switchTab('today');
 refreshAll();
});
